<div class="container mt-4">
    <h3>Editar Produto</h3>
  
    <div *ngIf="produto">
      <form (ngSubmit)="salvar()">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" id="nome" class="form-control" [(ngModel)]="produto.nome" name="nome">
        </div>
        
        <div class="mb-3">
          <label for="quantidade" class="form-label">Quantidade</label>
          <input type="number" id="quantidade" class="form-control" [(ngModel)]="produto.quantidade" name="quantidade">
        </div>
        
        <div class="mb-3">
          <label for="preco" class="form-label">Preço</label>
          <input type="number" id="preco" class="form-control" [(ngModel)]="produto.preco" name="preco">
        </div>
        
        <div class="mb-3">
          <label for="minStock" class="form-label">Estoque Mínimo</label>
          <input type="number" id="minStock" class="form-control" [(ngModel)]="produto.minStock" name="minStock">
        </div>
  
        <button type="submit" class="btn btn-primary">Salvar</button>
      </form>
    </div>
  </div>
