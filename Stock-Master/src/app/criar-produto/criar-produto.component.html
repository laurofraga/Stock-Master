<div class="container mt-4">
    <h2>Adicionar Novo Produto</h2>
    <form>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Produto</label>
        <input type="text" class="form-control" id="nome" placeholder="Nome do produto" required>
      </div>
  
      <div class="mb-3">
        <label for="quantidade" class="form-label">Quantidade</label>
        <input type="number" class="form-control" id="quantidade" placeholder="Quantidade em estoque" min="0" required>
      </div>
  
      <div class="mb-3">
        <label for="preco" class="form-label">Preço</label>
        <input type="number" class="form-control" id="preco" placeholder="Preço do produto" min="0" step="0.01" required>
      </div>
  
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">Salvar Produto</button>
        <a [routerLink]="'/produtos'" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
