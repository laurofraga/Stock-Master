<div class="container mt-5">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">Adicionar Fornecedor</h2>
      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form (ngSubmit)="criarFornecedor()">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Fornecedor</label>
          <input type="text" id="nome" class="form-control" [(ngModel)]="fornecedor.nome" name="nome" required>
        </div>
        <div class="mb-3">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" id="endereco" class="form-control" [(ngModel)]="fornecedor.endereco" name="endereco" required>
        </div>
        <div class="mb-3">
          <label for="contato" class="form-label">contato</label>
          <input type="text" id="cnpj" class="form-control" [(ngModel)]="fornecedor.contato" name="contato" required>
        </div>
  
        <div class="d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-secondary me-2"
            routerLink="/fornecedores"
          >
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary">
            Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
