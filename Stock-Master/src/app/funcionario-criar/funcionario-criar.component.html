<div class="container mt-4">
  <h2 class="text-center mb-4">Adicionar Funcionário</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form>
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input
        type="text"
        id="nome"
        class="form-control"
        [(ngModel)]="funcionario.nome"
        name="nome"
        required
      />
    </div>

    <div class="mb-3">
      <label for="username" class="form-label">Nome de Usuário</label>
      <input
        type="text"
        id="username"
        class="form-control"
        [(ngModel)]="funcionario.username"
        name="username"
        required
      />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail:</label>
      <input
        type="email"
        id="email"
        class="form-control"
        [(ngModel)]="funcionario.email"
        name="email"
        required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Senha:</label>
      <input
        type="password"
        id="password"
        class="form-control"
        [(ngModel)]="funcionario.password"
        name="password"
        required
      />
    </div>

    <button type="button" class="btn btn-primary" (click)="criarFuncionario()">
      Criar Funcionário
    </button>
  </form>
</div>
